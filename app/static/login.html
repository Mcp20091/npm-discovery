<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPM Discovery - Log in</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1c2330;--mut:#6b7585;--line:#e2e5ea;--acc:#2563eb;--bad:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--fg:#e6e9ef;--mut:#8b95a5;--line:#2b3340;--acc:#5b8def;--bad:#ef6b6b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
form{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px;width:300px;display:flex;flex-direction:column;gap:12px}
h1{font-size:18px;margin:0}
input,button{font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line)}
input{background:var(--bg);color:var(--fg)}
button{background:var(--acc);color:#fff;border-color:var(--acc);cursor:pointer}
button:disabled{opacity:.5}
#e{color:var(--bad);min-height:1.4em;font-size:13px}
</style>
</head>
<body>
<form id="f">
  <h1>NPM Discovery</h1>
  <input type="password" id="p" placeholder="Password" autocomplete="current-password" autofocus required>
  <button id="b">Log in</button>
  <div id="e"></div>
</form>
<script>
document.getElementById('f').onsubmit = async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; e.textContent = '';
  try {
    const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: document.getElementById('p').value})});
    if (r.ok) { location.reload(); return; }
    let j = {}; try { j = await r.json(); } catch {}
    e.textContent = j.detail || ('HTTP ' + r.status);
  } catch (err) { e.textContent = err.message; }
  b.disabled = false;
};
</script>
</body>
</html>
