<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPM Discovery</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1c2330;--mut:#6b7585;--line:#e2e5ea;--acc:#2563eb;--bad:#c62828;--ok:#2e7d32;--warn:#b26a00}
@media(prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--fg:#e6e9ef;--mut:#8b95a5;--line:#2b3340;--acc:#5b8def;--bad:#ef6b6b;--ok:#5fc16a;--warn:#e0a040}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;margin-right:auto}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.running,.stopped{color:var(--warn)}.finished{color:var(--ok)}.failed{color:var(--bad)}
button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
main{padding:16px 20px;max-width:1400px;margin:auto}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tab{padding:7px 14px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.tab.active{background:var(--card);border-color:var(--line);font-weight:600}
.banner{padding:10px 14px;border-radius:6px;margin-bottom:12px;background:color-mix(in srgb,var(--bad) 15%,var(--card));border:1px solid var(--bad)}
.banner.info{background:var(--card);border-color:var(--line)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap}
td.mut{color:var(--mut);font-size:12px}
.act{display:flex;flex-direction:column;gap:6px;width:300px;max-width:100%}
td{word-break:break-word}
main{overflow-x:auto}
.act .line{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.act input[type=text]{flex:1;min-width:0;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.act select{max-width:100%;padding:5px;border-radius:6px;background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.act label{font-size:12px;color:var(--mut);white-space:nowrap}
.gone{color:var(--bad);font-weight:600;font-size:12px}
.err{color:var(--bad);font-size:12px}
.empty{padding:30px;text-align:center;color:var(--mut)}
code{font-size:12px}
button.small{padding:3px 10px;font-size:13px}
/* roomier text, tighter table */
.nm{font-size:13px;color:var(--mut)}
.slog{font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto;padding:6px 4px}
.l-warn{color:var(--warn)}.l-error{color:var(--bad)}
.sh{cursor:pointer;user-select:none}
.sh:hover{color:var(--fg);text-decoration:underline}
body{font-size:15px}
a{color:var(--acc)}
main{max-width:1800px}
table{width:auto;max-width:100%}
td.dtc{max-width:340px}
thead th:nth-child(2){min-width:250px}
thead th:nth-child(4){min-width:170px}
thead th:nth-child(5){min-width:130px}
code{white-space:nowrap}
th{font-size:13px}
th,td{padding:9px 12px}
button{font-size:14px;padding:6px 13px}
.act{width:520px}
.act .line{gap:8px;align-items:center}
.act input[type=text]{min-width:130px}
select{padding:5px 8px;border-radius:6px;background:var(--bg);color:var(--fg);border:1px solid var(--line);font:inherit;max-width:280px;text-overflow:ellipsis}
.act select{max-width:210px}
.act label{font-size:14px;color:var(--fg)}
.badge{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--mut);margin-right:8px;vertical-align:1px}
.dt{font-weight:600}
.tb{display:flex;align-items:center;gap:6px}
.tb select{padding:5px 8px;border-radius:6px;background:var(--bg);color:var(--fg);border:1px solid var(--line);font:inherit}
.sett{max-width:640px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 18px 18px}
.sett h3{margin:18px 0 6px;font-size:14px}
.sf{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.sl{font-weight:600}.sl small{font-weight:400;color:var(--mut)}
.sett input[type=text],.sett input[type=password],.sett input[type=number],.sett textarea{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;width:100%}
.sett input[type=checkbox]{align-self:flex-start}
.sett .line{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.ok{color:var(--ok)}
small.mut{color:var(--mut)}
#logout{color:var(--mut);font-size:13px}
.sett #smsg{min-height:1.4em}
tr.ghead td{background:color-mix(in srgb,var(--acc) 7%,var(--card));border-top:2px solid var(--line);vertical-align:middle}
button.caret{padding:0 6px;font-size:12px;margin-right:6px;line-height:20px}
.ipc{font-size:12px;color:var(--mut);font-family:ui-monospace,Consolas,monospace}
.hn{font-weight:600}
</style>
</head>
<body>
<header>
  <h1>NPM Discovery</h1>
  <span id="last" class="mut"></span>
  <span id="st" class="pill"></span>
  <button id="stop" hidden>Stop scan</button>
  <button id="scan" class="primary">Scan now</button>
  <a href="#" id="logout" hidden>Log out</a>
</header>
<main>
  <div id="banners"></div>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab = 'new', data = {items: [], npm_error: null}, certs = [], status = {}, rowErr = {};
const TABS = [['new','New'],['proxied','Already proxied'],['dismissed','Dismissed'],['exclusions','Exclusions'],['history','History'],['settings','Settings']];
let hist = [];
async function loadHistory() { try { hist = (await api('/api/history')).items; } catch {} }
function dur(s) { if (!s.finished) return '-'; const t = Math.round(s.finished - s.started); return t >= 60 ? `${Math.floor(t / 60)}m ${t % 60}s` : `${t}s`; }
function renderHistory() {
  if (!hist.length) { $('#content').innerHTML = '<div class="empty">No scans yet.</div>'; return; }
  $('#content').innerHTML = `<div class="banner info">The last 100 scans. Services lists what a scan found; Log shows how the scan ran: the nmap command, warnings, and any ports that did not answer (possible firewall or security-software blocks).</div>
    <table><thead><tr><th>Started</th><th>Took</th><th>Status</th><th>Found</th><th>New</th><th>Gone</th><th></th></tr></thead><tbody>` +
    hist.map(s => `<tr><td>${fmt(s.started)}</td><td>${dur(s)}</td><td class="${esc(s.status)}">${esc(s.status)}${s.error ? `<br><span class="err">${esc(s.error)}</span>` : ''}</td>
      <td>${s.status === 'finished' ? s.found : '-'}</td><td>${s.status === 'finished' ? s.new_count : '-'}</td><td>${s.status === 'finished' ? s.gone_count : '-'}</td>
      <td>${s.status === 'finished' ? `<button data-a="hshow" data-id="${s.id}" class="small">Services</button> ` : ''}<button data-a="hlog" data-id="${s.id}" class="small">Log</button></td></tr>
      <tr id="h${s.id}" hidden><td colspan="7" class="mut"></td></tr><tr id="l${s.id}" hidden><td colspan="7"></td></tr>`).join('') + '</tbody></table>';
}
let sett = null, sdirty = false, smsg = {text: '', bad: false};
async function loadSettings() { try { sett = (await api('/api/settings')).settings; } catch (e) { smsg = {text: e.message, bad: true}; } }
const FIELDS = [
  ['Nginx Proxy Manager', [
    ['NPM_URL', 'text', 'NPM URL', 'e.g. http://192.168.1.10:81'],
    ['NPM_EMAIL', 'text', 'Login email', 'Use an NPM user without 2FA'],
    ['NPM_PASSWORD', 'password', 'Password', ''],
    ['NPM_VERIFY_TLS', 'bool', 'Verify NPM TLS certificate', 'Turn off for an https URL with a self-signed certificate']]],
  ['Discovery', [
    ['SCAN_SUBNETS', 'area', 'Subnets to scan', 'One per line or comma separated, e.g. 192.168.1.0/24'],
    ['BASE_DOMAIN', 'text', 'Base domain', 'Proxy hosts become subdomain.thisdomain, e.g. jellyfin.mydomain.com'],
    ['SCAN_INTERVAL_HOURS', 'number', 'Scan every (hours)', '0 = only when you click Scan now'],
    ['DEFAULT_CERT_ID', 'cert', 'Default SSL certificate', 'Preselected for every new discovery (you can still change it per row). Needs NPM to be reachable.'],
    ['SCAN_ON_START', 'bool', 'Scan when the service starts', ''],
    ['SCAN_PORTS', 'area', 'Ports to check', 'Comma separated; ranges allowed, e.g. 42000-42009'],
    ['SCAN_ALL_PORTS', 'bool', 'Scan all 65535 ports', 'Much slower and more likely to trigger security software'],
    ['SCAN_GENTLE', 'bool', 'Gentle scan', 'Slower (rate-limited, few parallel probes) but less likely to trigger security software or upset the network'],
    ['PROBE_TIMEOUT', 'number', 'Probe timeout (seconds)', '']]],
  ['Web page', [
    ['WEB_HOST', 'text', 'Listen address', 'Needs a service restart'],
    ['WEB_PORT', 'number', 'Listen port', 'Needs a service restart']]]];
function renderSettings() {
  if (!sett) { $('#content').innerHTML = '<div class="empty">Loading…</div>'; return; }
  const field = ([k, t, label, hint]) => {
    const s = sett[k], v = esc(s.value);
    let input;
    if (t === 'bool') input = `<input type="checkbox" data-k="${k}" ${String(s.value).toLowerCase() === 'true' ? 'checked' : ''}>`;
    else if (t === 'cert') input = `<select data-k="${k}"><option value="0">No default certificate</option>${+s.value && !certs.some(c => String(c.id) === String(s.value)) ? `<option value="${esc(s.value)}" selected>Certificate ${esc(s.value)} (not found in NPM)</option>` : ''}${certs.map(c => certOpt(c, String(c.id) === String(s.value))).join('')}</select>`;
    else if (t === 'area') input = `<textarea data-k="${k}" rows="3">${v}</textarea>`;
    else input = `<input type="${t}" data-k="${k}" value="${v}" ${k === 'NPM_PASSWORD' ? `placeholder="${s.set ? '(saved - leave blank to keep)' : 'not set'}" autocomplete="new-password"` : ''}>`;
    return `<label class="sf"><span class="sl">${label}<small> · ${s.source === 'ui' ? 'saved here' : s.source === 'config' ? 'from config.env' : 'default'}</small></span>${input}<small class="mut">${hint}</small></label>`;
  };
  $('#content').innerHTML = `<div class="sett">` + FIELDS.map(([g, fs]) => `<h3>${g}</h3>${fs.map(field).join('')}`).join('') +
    `<div class="line"><button class="primary" data-a="ssave">Save</button><button data-a="stest">Test NPM connection</button></div>
     <div class="${smsg.bad ? 'err' : 'ok'}" id="smsg">${esc(smsg.text)}</div>
     <h3>Web page password</h3>
     <label class="sf"><span class="sl">${status.auth ? 'Change password' : 'Set a password'}<small> · ${status.auth ? 'enabled' : 'off - anyone on the network can open this page'}</small></span>
       <input type="password" id="pw" autocomplete="new-password" placeholder="New password (at least 8 characters)">
       <small class="mut">Sent unencrypted unless you put this page behind HTTPS. Removing the password needs a logged-in session.</small></label>
     <div class="line"><button data-a="spw">${status.auth ? 'Change password' : 'Set password'}</button>${status.auth ? '<button data-a="spwoff">Remove password</button>' : ''}</div>
     <h3>Backup &amp; restore</h3>
     <label class="sf"><span><input type="checkbox" id="bk-res" checked> Include discoveries, dismissals and scan history</span></label>
     <label class="sf"><span><input type="checkbox" id="bk-sec"> Include passwords (NPM password and web page password)</span><small class="mut">Anyone with the file can read the NPM password. Off by default; you re-enter it after restoring.</small></label>
     <div class="line"><button data-a="sbackup">Download backup</button></div>
     <div class="line"><input type="file" id="rf" accept=".json,application/json"><button data-a="srestore">Restore from file</button></div>
     <small class="mut">Restoring replaces settings, exclusions, host names and, if the file has them, discoveries and history.</small>
     <h3>Maintenance</h3><div class="line"><button data-a="sreset">Reset all to config.env</button><button data-a="srestart">Restart service</button></div>
     <small class="mut">Settings saved here override config.env. Skipped addresses are on the Exclusions tab.</small></div>`;
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'exv') { e.preventDefault(); document.querySelector('button[data-a=addexcl]').click(); }
});
document.addEventListener('input', e => { if (e.target.closest('.sett')) sdirty = true; });
let excl = {items: [], from_config: []}, exclErr = '';
async function loadExcl() { try { excl = await api('/api/exclusions'); } catch {} }
function renderExcl() {
  const rows = excl.from_config.map(v => `<tr><td>${esc(v)}</td><td class="mut">from config.env</td><td></td></tr>`).concat(
    excl.items.map(x => `<tr><td>${esc(x.value)}</td><td class="mut">added here</td><td><button data-a="rmexcl" data-id="${x.id}">Remove</button></td></tr>`));
  $('#content').innerHTML = `<div class="banner info">These addresses are skipped by every scan. Use it for your router, PC or anything that objects to port scans. Takes effect on the next scan.</div>
    <div class="act" style="flex-direction:row;margin-bottom:12px;width:auto"><input type="text" id="exv" placeholder="192.168.1.5   192.168.1.50-60   192.168.1.128/28" style="max-width:380px">
    <button class="primary" data-a="addexcl">Add</button></div><div class="err" style="margin-bottom:8px">${esc(exclErr)}</div>` +
    (rows.length ? `<table><thead><tr><th>Skipped address</th><th>Source</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table>` : '<div class="empty">No exclusions.</div>');
}

const fmt = t => t ? new Date(t*1000).toLocaleString() : '-';
async function api(path, opts) {
  const r = await fetch(path, opts);
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 401 && !path.startsWith('/api/login')) { location.reload(); throw new Error('Login required'); }
  if (!r.ok) throw new Error(j.detail || j.error || ('HTTP ' + r.status));
  return j;
}

async function loadStatus() {
  try { status = await api('/api/status'); } catch (e) { return; }
  const l = status.last;
  const s = status.running ? 'running' : (l ? l.status : 'never run');
  $('#st').className = 'pill ' + s; $('#st').textContent = 'Scan: ' + s;
  $('#last').textContent = l ? 'Last scan: ' + fmt(l.finished || l.started) + (l.status === 'finished' ? ` (${l.found} services)` : '') : 'No scan yet';
  $('#scan').disabled = status.running;
  $('#stop').hidden = !status.running;
  $('#logout').hidden = !status.auth;
  renderBanners();
}

function renderBanners() {
  let h = '';
  (status.config_problems || []).forEach(p => h += `<div class="banner">${esc(p)}</div>`);
  if (status.last && status.last.status === 'failed') h += `<div class="banner">Scan failed: ${esc(status.last.error)}</div>`;
  if (data.npm_error) h += `<div class="banner">${esc(data.npm_error)}</div>`;
  $('#banners').innerHTML = h;
}

async function loadData() {
  try { data = await api('/api/discoveries'); } catch (e) { data = {items: [], npm_error: e.message}; }
  renderBanners(); render();
}
async function loadCerts() {
  try { certs = (await api('/api/certificates')).items; } catch { certs = []; }
}

function render() {
  const count = k => k === 'exclusions' ? excl.items.length + excl.from_config.length : data.items.filter(i => i.state === k).length;
  $('#tabs').innerHTML = TABS.map(([k, n]) => `<div class="tab ${k === tab ? 'active' : ''}" data-t="${k}">${n}${k === 'settings' || k === 'history' ? '' : ` (${count(k)})`}</div>`).join('');
  if (tab === 'settings') { if (!sdirty) renderSettings(); return; }
  if (tab === 'exclusions') { renderExcl(); return; }
  if (tab === 'history') { renderHistory(); return; }
  const items = data.items.filter(i => i.state === tab);
  if (!items.length) { $('#content').innerHTML = `<div class="empty">Nothing here.</div>`; return; }
  const extra = tab === 'proxied' ? '<th>Proxy host</th>' : '<th>Action</th>';
  const allOn = items.every(i => sel.has(i.ip));
  const so = (v, cur, label) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${label}</option>`;
  $('#content').innerHTML = `<div class="line" style="margin-bottom:12px;align-items:center;display:flex;flex-wrap:wrap;gap:10px"><button data-a="exclsel" ${sel.size ? '' : 'disabled'}>Exclude selected hosts (${sel.size})</button>
    <label class="tb">Group <select id="grpmode">${so('ip', groupMode, 'By IP')}${so('name', groupMode, 'By host name')}${so('none', groupMode, 'No grouping')}</select></label>
    <label class="tb">Sort <select id="sortby">${so('ip', sortBy, 'IP')}${so('name', sortBy, 'Host name')}${so('title', sortBy, 'Details')}${so('mac', sortBy, 'MAC')}${so('seen', sortBy, 'Last seen')}</select>
      <button data-a="sortdir" class="small" title="Switch between ascending and descending">${sortDir === 'asc' ? '&#9650; Ascending' : '&#9660; Descending'}</button></label>
    ${groupMode !== 'none' ? '<button data-a="collapseall" class="small">Collapse all</button><button data-a="expandall" class="small">Expand all</button>' : ''}
    ${items.some(i => i.mac && !i.vendor) ? '<button data-a="vendorall" title="Uses nmap\'s offline vendor list; nothing is sent to the internet">Look up all MAC vendors</button>' : ''}</div>
    <table><thead><tr><th><input type="checkbox" id="selall" title="Select all" ${allOn ? 'checked' : ''}></th><th>${sortHead('name', 'Host')} / ${sortHead('ip', 'IP')} / service</th><th class="det">${sortHead('title', 'Details')}</th><th>${sortHead('mac', 'MAC')}</th><th>${sortHead('seen', 'Last seen')}</th>${extra}</tr></thead><tbody>` +
    tableBody(items) + '</tbody></table>';
}
const sel = new Set();
const certOpt = (c, on) => `<option value="${c.id}" title="${esc((c.domains || []).join(', '))}" ${on ? 'selected' : ''}>${esc(c.name)}</option>`;
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
let groupMode = (() => { const m = lsGet('npmd.groupmode'); return ['ip', 'name', 'none'].includes(m) ? m : (lsGet('npmd.group') === '0' ? 'none' : 'ip'); })();
const SORTS = ['ip', 'name', 'title', 'mac', 'seen'];
let sortBy = SORTS.includes(lsGet('npmd.sort')) ? lsGet('npmd.sort') : 'ip';
let sortDir = lsGet('npmd.dir') === 'desc' ? 'desc' : 'asc';
const dispName = i => i.host_name || i.hostname || '';
const fshort = t => t ? new Date(t * 1000).toLocaleString([], {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}) : '-';
const macHtml = m => m && m.mac ? `<code>${esc(m.mac)}</code><br>${m.vendor ? esc(m.vendor) : `<button data-a="vendor" data-id="${m.id}" class="small">Look up</button>`}`
  : '<span class="mut" title="MAC addresses are only visible for devices on the same network segment as this container">-</span>';
const collapsed = new Set((() => { try { return JSON.parse(lsGet('npmd.collapsed') || '[]'); } catch { return []; } })());
const saveCollapsed = () => lsSet('npmd.collapsed', JSON.stringify([...collapsed]));
const ipKey = ip => ip.split('.').reduce((a, o) => a * 256 + (+o || 0), 0);
// main name: saved name, else reverse-DNS name, else the IP; the IP (and a second name) stay visible beside it
function hostHtml(ip, hn, dns, withIp = true) {
  const main = hn || dns || '';
  return `<span class="hn">${esc(main || ip)}</span>${main && withIp ? ` <span class="ipc">${esc(ip)}</span>` : ''}${hn && dns ? ` <small class="mut">${esc(dns)}</small>` : ''}`;
}
const renameBtn = (ip, name) => `<button class="small" data-a="rename" data-ip="${esc(ip)}" data-name="${esc(name || '')}" title="Give this host a friendly name (blank clears it)">Rename</button>`;
function groupHead(key, list) {
  const ips = [...new Set(list.map(i => i.ip))];
  const hn = (list.find(i => i.host_name) || {}).host_name || '', dns = (list.find(i => i.hostname) || {}).hostname || '';
  const open = !collapsed.has(key);
  // grouped by IP: the IP is the name, the host name sits beside it smaller; grouped by name: the reverse
  const head = groupMode === 'ip' && ips.length === 1
    ? `<span class="hn">${esc(ips[0])}</span>${hn || dns ? ` <span class="nm">${esc(hn || dns)}</span>` : ''}${hn && dns ? ` <small class="mut">${esc(dns)}</small>` : ''}`
    : ips.length === 1 ? hostHtml(ips[0], hn, dns)
    : `<span class="hn">${esc(hn || dns || ips[0])}</span> ${ips.map(ip => `<span class="ipc">${esc(ip)}</span>`).join(' ')}`;
  return `<tr class="ghead" data-gh="${esc(key)}"><td><input type="checkbox" class="selg" data-ips="${esc(ips.join(' '))}" ${ips.every(ip => sel.has(ip)) ? 'checked' : ''}></td>
    <td colspan="2"><button class="caret" data-a="gtoggle" data-ip="${esc(key)}" title="Collapse / expand">${open ? '&#9660;' : '&#9654;'}</button>${head}
      <small class="mut"> &middot; ${list.length} service${list.length > 1 ? 's' : ''}</small></td>
    <td>${macHtml(list.find(i => i.mac))}</td>
    <td colspan="2">${renameBtn(ips.join(' '), hn)}</td></tr>`;
}
function sortKey(i) {
  switch (sortBy) {
    case 'name': return (dispName(i) || i.ip).toLowerCase();
    case 'title': return (i.title || '').toLowerCase() || null;
    case 'mac': return i.mac || null;
    case 'seen': return i.last_seen || null;
    default: return ipKey(i.ip);
  }
}
function cmpItems(a, b) {
  const ka = sortKey(a), kb = sortKey(b);
  let r = 0;
  if (ka === null || kb === null) { if (ka !== kb) return ka === null ? 1 : -1; }  // empty values always sort last
  else r = typeof ka === 'string' ? ka.localeCompare(kb, undefined, {numeric: true}) : ka - kb;
  if (sortDir === 'desc') r = -r;
  return r || ipKey(a.ip) - ipKey(b.ip) || a.port - b.port;  // ports always ascending within a host
}
const sortInd = k => sortBy === k ? (sortDir === 'asc' ? ' &#9650;' : ' &#9660;') : '';
const sortHead = (k, label) => `<span class="sh" data-sort="${k}" title="Sort by ${label.toLowerCase()} (click again to reverse)">${label}${sortInd(k)}</span>`;
function tableBody(items) {
  const sorted = items.slice().sort(cmpItems);
  if (groupMode === 'none') return sorted.map(i => row(i, false)).join('');
  const by = new Map();
  sorted.forEach(i => { const k = groupMode === 'ip' ? i.ip : 'n:' + (dispName(i) || i.ip).toLowerCase(); if (!by.has(k)) by.set(k, []); by.get(k).push(i); });
  return [...by.entries()].map(([k, list]) => groupHead(k, list) + list.map(i => row(i, true, k)).join('')).join('');
}
function setCollapsed(ip, c) {  // toggles hidden on the rows, no re-render, so typed subdomains survive
  c ? collapsed.add(ip) : collapsed.delete(ip);
  document.querySelectorAll('tr.svc').forEach(r => { if (r.dataset.g === ip) r.hidden = c; });
  document.querySelectorAll('tr.ghead').forEach(r => { if (r.dataset.gh === ip) r.querySelector('.caret').innerHTML = c ? '&#9654;' : '&#9660;'; });
}
document.addEventListener('change', e => {
  if (e.target.id === 'grpmode') { groupMode = e.target.value; lsSet('npmd.groupmode', groupMode); render(); }
  else if (e.target.id === 'sortby') { sortBy = e.target.value; lsSet('npmd.sort', sortBy); render(); }
});
const defCertId = () => (sett && sett.DEFAULT_CERT_ID) ? +sett.DEFAULT_CERT_ID.value || 0 : 0;
function selUi() { const b = document.querySelector('button[data-a=exclsel]'); if (b) { b.disabled = !sel.size; b.textContent = `Exclude selected hosts (${sel.size})`; } }
document.addEventListener('change', e => {  // selection is per IP: exclusions apply to a whole host
  const t = e.target, cl = t.classList;
  if (t.id !== 'selall' && !(cl && (cl.contains('sel') || cl.contains('selg')))) return;
  const set = (ips, on) => ips.forEach(ip => on ? sel.add(ip) : sel.delete(ip));
  if (t.id === 'selall') {
    document.querySelectorAll('.sel').forEach(c => set([c.dataset.ip], t.checked));
    document.querySelectorAll('.selg').forEach(c => set(c.dataset.ips.split(' '), t.checked));
  } else set(cl.contains('selg') ? t.dataset.ips.split(' ') : [t.dataset.ip], t.checked);
  document.querySelectorAll('.sel').forEach(c => c.checked = sel.has(c.dataset.ip));
  document.querySelectorAll('.selg').forEach(c => c.checked = c.dataset.ips.split(' ').every(ip => sel.has(ip)));
  selUi();
});

function row(i, grouped, gkey) {
  const gone = i.missing ? ' <span class="gone" title="Not found in the last scan">GONE</span>' : '';
  let action;
  if (tab === 'proxied') action = esc(i.proxy_domains.join(' | '));
  else if (tab === 'dismissed') action = `<button data-a="restore" data-id="${i.id}">Restore</button>`;
  else {
    const opts = '<option value="0">No SSL certificate</option>' + certs.map(c => certOpt(c, c.id === defCertId())).join('');
    action = `<div class="act" id="r${i.id}">
      <div class="line"><input type="text" class="sub" value="${esc(i.suggestion)}"><span>.${esc(status.base_domain)}</span><select class="cert">${opts}</select></div>
      <div class="line"><label><input type="checkbox" class="be" checked> Block exploits</label>
        <label><input type="checkbox" class="ws" checked> Websockets</label><button class="primary" data-a="add" data-id="${i.id}">Add</button>
        <button data-a="dismiss" data-id="${i.id}">Dismiss</button>
        <button data-a="exclude" data-ip="${esc(i.ip)}" data-id="${i.id}" title="Never scan this IP again">Exclude host</button></div>
      <div class="err">${esc(rowErr[i.id] || '')}</div></div>`;
  }
  const url = `${i.scheme}://${i.ip}:${i.port}/`;
  const hurl = i.hostname ? `${i.scheme}://${i.hostname}:${i.port}/` : '';  // reverse-DNS name, if the scan found one
  const links = `<span class="badge">${esc(i.scheme)}</span><a href="${esc(url)}" target="_blank" rel="noopener noreferrer" title="Open ${esc(url)} in a new tab"><b>${esc(i.ip)}:${i.port}</b> &#8599;</a>${gone}
      ${hurl ? `<br><a class="small" href="${esc(hurl)}" target="_blank" rel="noopener noreferrer" title="Open ${esc(hurl)} in a new tab">${esc(i.hostname)}:${i.port} &#8599;</a>` : ''}`;
  const details = `<div class="dt">${i.title ? esc(i.title) : '<span class="mut">-</span>'}</div>${i.server ? `<small class="mut">${esc(i.server)}</small>` : ''}`;
  const seen = `<span title="First seen ${esc(fmt(i.first_seen))}">${esc(fshort(i.last_seen))}</span>`;
  if (grouped) return `<tr class="svc" data-g="${esc(gkey)}" ${collapsed.has(gkey) ? 'hidden' : ''}><td></td><td>${links}</td><td class="dtc">${details}</td><td></td><td class="mut">${seen}</td><td>${action}</td></tr>`;
  return `<tr><td><input type="checkbox" class="sel" data-ip="${esc(i.ip)}" ${sel.has(i.ip) ? 'checked' : ''}></td>
    <td><div>${i.host_name || i.hostname ? hostHtml(i.ip, i.host_name, i.hostname, false) + ' ' : ''}${renameBtn(i.ip, i.host_name)}</div>${links}</td><td class="dtc">${details}</td>
    <td>${macHtml(i)}</td><td class="mut">${seen}</td><td>${action}</td></tr>`;
}

document.addEventListener('click', async e => {  const t = e.target.closest('.tab'); if (t) { tab = t.dataset.t; sdirty = false; sel.clear(); if (tab === 'settings') { smsg = {text: '', bad: false}; await loadSettings(); if (!certs.length) await loadCerts(); } if (tab === 'history') await loadHistory(); render(); return; }
  const sh = e.target.closest('[data-sort]');
  if (sh) { const k = sh.dataset.sort; if (sortBy === k) sortDir = sortDir === 'asc' ? 'desc' : 'asc'; else { sortBy = k; sortDir = 'asc'; } lsSet('npmd.sort', sortBy); lsSet('npmd.dir', sortDir); render(); return; }
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const id = b.dataset.id, a = b.dataset.a;
  if (a === 'gtoggle') { setCollapsed(b.dataset.ip, !collapsed.has(b.dataset.ip)); saveCollapsed(); return; }
  if (a === 'collapseall' || a === 'expandall') {
    document.querySelectorAll('tr.ghead').forEach(r => setCollapsed(r.dataset.gh, a === 'collapseall'));
    saveCollapsed(); return;
  }
  if (a === 'sortdir') { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; lsSet('npmd.dir', sortDir); render(); return; }
  if (a === 'rename') {
    const ips = b.dataset.ip.split(' ');  // a host-name group can hold several IPs; all get the same name
    const nm = prompt(`Name for ${ips.join(', ')} (leave blank to remove the saved name):`, b.dataset.name);
    if (nm === null) return;
    try {
      for (const ip of ips) await api('/api/hosts/name', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ip, name: nm})});
      await loadData();
    } catch (err) { alert(err.message); }
    return;
  }
  if (a === 'hlog') {
    const row = $('#l' + id);
    if (!row.hidden) { row.hidden = true; return; }
    try {
      const items = (await api(`/api/history/${id}/log`)).items;
      const time = ts => new Date(ts * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
      row.firstElementChild.innerHTML = items.length
        ? `<div class="slog">${items.map(l => `<div class="l-${esc(l.level)}"><span class="mut">${esc(time(l.ts))}</span> ${esc(l.level === 'info' ? '' : l.level.toUpperCase() + ':')} ${esc(l.msg)}</div>`).join('')}</div>`
        : '<span class="mut">No log was recorded for this scan (it ran before logging existed).</span>';
      row.hidden = false;
    } catch (err) { alert(err.message); }
    return;
  }
  if (a === 'hshow') {
    const row = $('#h' + id);
    if (!row.hidden) { row.hidden = true; return; }
    try {
      const items = (await api('/api/history/' + id)).items;
      row.firstElementChild.innerHTML = items.length ? items.map(i => `${esc(i.ip)}:${i.port} ${esc(i.scheme)} - ${esc(i.title) || '(no title)'}`).join('<br>') : 'No services.';
      row.hidden = false;
    } catch (err) { alert(err.message); }
    return;
  }
  if (a === 'vendor' || a === 'vendorall') {
    b.disabled = true;
    try { await api(a === 'vendor' ? `/api/discoveries/${id}/vendor` : '/api/vendors/lookup', {method: 'POST'}); await loadData(); }
    catch (err) { alert(err.message); b.disabled = false; }
    return;
  }
  if (a === 'exclsel') {
    const ips = [...sel]; if (!ips.length) return;
    if (!confirm(`Exclude ${ips.length} host${ips.length > 1 ? 's' : ''} (${ips.slice(0, 5).join(', ')}${ips.length > 5 ? ', …' : ''})?\nThey will be skipped by all future scans and removed from these lists.`)) return;
    const failed = [];
    for (const ip of ips) {
      try { await api('/api/exclusions', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({value: ip})}); }
      catch (err) { failed.push(ip + ': ' + err.message); }
    }
    sel.clear(); await loadExcl(); await loadData();
    if (failed.length) alert('Some could not be excluded:\n' + failed.join('\n'));
    return;
  }
  if (a.startsWith('s')) {
    const msg = (text, bad) => { smsg = {text, bad: !!bad}; const m = $('#smsg'); if (m) { m.className = bad ? 'err' : 'ok'; m.textContent = text; } };
    try {
      if (a === 'ssave') {
        const values = {};
        document.querySelectorAll('.sett [data-k]').forEach(el => values[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value);
        const r = await api('/api/settings', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({values})});
        sdirty = false; await loadSettings(); await loadStatus(); await loadData(); renderSettings();
        msg(r.restart_needed ? 'Saved. Restart the service to apply the web page address/port.' : 'Saved.');
      } else if (a === 'stest') {
        msg('Testing…'); const r = await api('/api/npm/test', {method: 'POST'});
        msg(`Connected to NPM (${r.proxy_hosts} proxy hosts). Save first if you changed the fields.`);
      } else if (a === 'sbackup') {
        const sec = $('#bk-sec').checked;
        if (sec && !confirm('This file will contain your passwords in readable form. Keep it private. Continue?')) return;
        location.href = `/api/backup?results=${$('#bk-res').checked}&secrets=${sec}`;
        msg('Backup downloading.');
      } else if (a === 'srestore') {
        const f = $('#rf').files[0]; if (!f) { msg('Choose a backup file first.', true); return; }
        const text = await f.text(); let d;
        try { d = JSON.parse(text); } catch { msg('That file is not valid JSON.', true); return; }
        const parts = ['settings', 'exclusions', 'host_names', 'discoveries', 'scans'].filter(k => k in d);
        if (!confirm(`Restore from ${f.name}?\nThis replaces: ${parts.join(', ') || 'nothing recognised'}.`)) return;
        await api('/api/restore', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: text});
        sdirty = false; await Promise.all([loadSettings(), loadExcl(), loadHistory(), loadStatus()]); await loadData(); renderSettings();
        msg('Restored: ' + parts.join(', ') + '.');
      } else if (a === 'sreset') {
        if (!confirm('Discard everything saved in the web page and go back to config.env?')) return;
        await api('/api/settings', {method: 'DELETE'}); sdirty = false; await loadSettings(); await loadStatus(); await loadData(); renderSettings(); msg('Reset.');
      } else if (a === 'spw') {
        const pw = $('#pw').value; if (!pw) { msg('Enter a new password first.', true); return; }
        await api('/api/password', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: pw})});
        await loadStatus(); renderSettings(); msg('Password saved. You stay logged in; other sessions were signed out.');
      } else if (a === 'spwoff') {
        if (!confirm('Remove the password? Anyone on the network will be able to open this page.')) return;
        await api('/api/password', {method: 'DELETE'}); await loadStatus(); renderSettings(); msg('Password removed.');
      } else if (a === 'srestart') {
        if (!confirm('Restart the service now?')) return;
        await api('/api/restart', {method: 'POST'}); msg('Restarting… reload this page in a few seconds.');
      }
    } catch (err) { msg(err.message, true); }
    return;
  }
  try {
    if (a === 'addexcl' || a === 'rmexcl' || a === 'exclude') {
      exclErr = '';
      try {
        if (a === 'addexcl') await api('/api/exclusions', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({value: $('#exv').value})});
        else if (a === 'exclude') { if (!confirm(`Exclude ${b.dataset.ip}? It will be skipped by all future scans.`)) return;
          await api('/api/exclusions', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({value: b.dataset.ip})}); }
        else await api('/api/exclusions/' + id, {method: 'DELETE'});
      } catch (err) { exclErr = err.message; if (a === 'exclude') alert(err.message); }
      const typed = (a === 'addexcl' && $('#exv')) ? $('#exv').value : '';
      await loadExcl();
      if (a === 'exclude') await loadData(); else render();
      if (a !== 'exclude') { const x = $('#exv'); if (x) { x.value = exclErr ? typed : ''; x.focus(); } }
      return;
    }
    if (a === 'add') {
      const r = $('#r' + id), cert = +r.querySelector('.cert').value;
      b.disabled = true; delete rowErr[id];
      await api(`/api/discoveries/${id}/add`, {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({subdomain: r.querySelector('.sub').value, block_exploits: r.querySelector('.be').checked,
          websockets: r.querySelector('.ws').checked, certificate_id: cert || null})});
    } else await api(`/api/discoveries/${id}/${a}`, {method: 'POST'});
    await loadData();
  } catch (err) {
    rowErr[id] = err.message; b.disabled = false; render();
  }
});

$('#stop').onclick = async () => {
  $('#stop').disabled = true;
  try { await api('/api/scan/stop', {method: 'POST'}); } catch (e) { alert(e.message); }
  $('#stop').disabled = false;
  loadStatus();
};

$('#logout').onclick = async e => { e.preventDefault(); try { await fetch('/api/logout', {method: 'POST'}); } catch {} location.reload(); };
$('#scan').onclick = async () => {
  await loadStatus();
  const subs = status.subnets || [], n = status.exclusion_count || 0;
  const msg = (subs.length ? 'Scan these subnets: ' + subs.join(', ') + '.' : 'No subnets are set, so the scan will fail.') + '\n'
    + (n ? n + ' exclusion' + (n === 1 ? ' is' : 's are') + ' active.' : 'No exclusions are set, so every host in the subnets will be scanned.')
    + '\n\nStart the scan?';
  if (!confirm(msg)) return;
  try { await api('/api/scan', {method: 'POST'}); } catch (e) { alert(e.message); }
  loadStatus();
};

let wasRunning = false;
async function tick() {
  await loadStatus();
  if (wasRunning && !status.running) { await loadData(); await loadHistory(); }
  wasRunning = status.running;
}
(async () => { await loadStatus(); await loadCerts(); await loadSettings(); await loadExcl(); await loadData(); setInterval(tick, 3000); setInterval(() => { if (!document.activeElement.closest('.act')) loadData(); }, 60000); })();
</script>
</body>
</html>
